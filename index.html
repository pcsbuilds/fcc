function clone(x){return JSON.parse(JSON.stringify(x))}
function uid(prefix='id'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function num(v,d=0){const n=Number(v);return Number.isFinite(n)?n:d}
function money(v){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(num(v))}
function pct(v,d=1){return (num(v)*100).toFixed(d)+'%'}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const s=JSON.parse(raw);if(s.schemaVersion===1)return s}}catch(e){} return clone(BOOT)}
function saveState(){appState.savedAt=new Date().toISOString();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(appState));setSave('Saved locally')}catch(e){setSave('Local save unavailable - export backup')} }
function setSave(t){const el=document.getElementById('saveStatus');if(el)el.textContent=t}
function state(){if(appState.mode==='planning'){if(!appState.planning)appState.planning=clone(appState.live);return appState.planning}return appState.live}
function coreScenario(funding,strategy){return CORE.scenarios.find(s=>s.funding===Number(funding)&&s.strategy===strategy)}
function currentFico(s=state()){const arr=s.ficoReadings||[];return arr.length?num(arr[arr.length-1].score):0}
function portfolio(s=state()){
 const cards=s.cards||[];const bal=cards.reduce((a,c)=>a+num(c.balance),0),lim=cards.reduce((a,c)=>a+num(c.limit),0);const interest=cards.reduce((a,c)=>a+num(c.balance)*num(c.apr)/100,0);const utils=cards.map(c=>num(c.limit)>0?num(c.balance)/num(c.limit):0);return{balance:bal,limit:lim,available:lim-bal,util:lim?bal/lim:0,interest,high90:utils.filter(u=>u>=.9).length,high70:utils.filter(u=>u>=.7).length,high50:utils.filter(u=>u>=.5).length,under30:utils.filter(u=>u<.3).length,zero:cards.filter(c=>num(c.balance)<=.01).length}}
function readiness(s=state()){
 const p=portfolio(s),fico=currentFico(s);if(p.high90>0||p.util>=.70)return{label:'RED - wait',cls:'red',reason:'Severe utilization remains.'};if(p.util>=.30||p.high50>0||fico<700)return{label:'YELLOW - improving',cls:'',reason:'Allow reporting cycles and verify prequalification.'};return{label:'GREEN - review prequalification',cls:'green',reason:'Profile appears materially cleaner; still verify issuer-specific factors.'}}
function utilClass(u){return u>=.9?'bad':u>=.5?'mid':'good'}
function renderNav(){const nav=document.getElementById('nav');nav.innerHTML=NAV.map(n=>`<button type="button" data-page-btn="${n}" class="${n===currentPage?'active':''}">${n}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.pageBtn)));document.getElementById('navNote').textContent=appState.mode==='planning'?'Planning Mode is a sandbox. Changes do not affect Live Mode until explicitly applied.':'Live Mode is the authoritative record.'}
function go(page){currentPage=page;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.dataset.page===page));renderNav();renderPage(page)}
function setMode(mode){if(mode==='planning'&&!appState.planning)appState.planning=clone(appState.live);appState.mode=mode;document.getElementById('modeLabel').textContent=mode==='live'?'Live':'Planning';document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));saveState();renderNav();renderAll()}
function kpi(label,value,sub=''){return `<div class="card kpi span-3"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function planOptions(){return CORE.scenarios.map(s=>`<option value="${s.funding}|${esc(s.strategy)}" ${s.funding===appState.activePlan.funding&&s.strategy===appState.activePlan.strategy?'selected':''}>${money(s.funding)} - ${esc(s.strategy)}</option>`).join('')}
function cardByName(s,name){return (s.cards||[]).find(c=>c.name===name)}
function actualPaidByCard(s,name){return (s.events||[]).filter(e=>e.type==='Payment'&&e.cardName===name).reduce((a,e)=>a+num(e.amount),0)}
function renderDashboard(){const s=state(),p=portfolio(s),r=readiness(s),plan=coreScenario(appState.activePlan.funding,appState.activePlan.strategy);const starting=(initialPersonal.cards||[]).reduce((a,c)=>a+num(c.balance),0),paid=Math.max(0,starting-p.balance),prog=appState.activePlan.funding?Math.min(1,paid/appState.activePlan.funding):0;const gap=plan?Math.max(0,p.balance-plan.metrics.total_end):0;
 document.getElementById('dashboard').innerHTML=`<div class="grid">${kpi('Current debt',money(p.balance),'Starting baseline '+money(starting))}${kpi('Aggregate utilization',pct(p.util,1),'Available credit '+money(p.available))}${kpi('Annualized interest',money(p.interest),'Simple balance x APR estimate')}${kpi('Current FICO',currentFico(s)||'Pending','Supplied / tracked score, not predicted')}
 <div class="card span-8"><div class="section-title"><h2>Plan Progress</h2><div class="toolbar"><select id="dashPlanSelect">${planOptions()}</select></div></div><div class="progress"><span style="width:${(prog*100).toFixed(1)}%"></span></div><div class="metricline"><span>Debt reduction from baseline</span><strong>${money(paid)}</strong></div><div class="metricline"><span>Active target funding</span><strong>${money(appState.activePlan.funding)}</strong></div><div class="metricline"><span>Gap to modeled ending debt</span><strong>${money(gap)}</strong></div><div class="metricline"><span>Selected strategy</span><strong>${esc(appState.activePlan.strategy)}</strong></div></div>
 <div class="card span-4"><div class="section-title"><h2>Credit Readiness</h2></div><div class="readiness"><span class="dot ${r.cls}"></span><strong>${r.label}</strong></div><p class="muted small">${r.reason}</p><div class="metricline"><span>Cards >=90%</span><strong>${p.high90}</strong></div><div class="metricline"><span>Cards >=50%</span><strong>${p.high50}</strong></div><div class="metricline"><span>Cards <30%</span><strong>${p.under30}</strong></div></div>
 <div class="card span-12"><div class="section-title"><h2>Utilization</h2><span class="muted small">Lower is generally more favorable; exact scoring thresholds are not guaranteed.</span></div>${cardsUtilTable(s.cards)}</div>
 <div class="card span-6"><div class="section-title"><h2>Interest</h2></div><div class="metricline"><span>Annualized interest at current balances</span><strong>${money(p.interest)}</strong></div><div class="metricline"><span>Approx. monthly annualized burden</span><strong>${money(p.interest/12)}</strong></div>${plan?`<div class="metricline"><span>Modeled annual interest after selected plan</span><strong>${money(plan.metrics.annual_interest_after)}</strong></div>`:''}</div>
 <div class="card span-6"><div class="section-title"><h2>Next Actions</h2></div>${nextActions(s,p,r)}</div></div>`;
 document.getElementById('dashPlanSelect').addEventListener('change',e=>{const [f,...rest]=e.target.value.split('|');appState.activePlan={funding:Number(f),strategy:rest.join('|')};saveState();renderDashboard()});}
function nextActions(s,p,r){const items=[];if(p.high90>0)items.push('Remove all remaining 90%+ individual utilization before a new-card application.');if(!(s.cards||[]).every(c=>c.statementDate&&c.dueDate))items.push('Enter statement closing and due dates for every card before execution timing is finalized.');if(!s.settings?.ficoModel)items.push('Record FICO model/bureau source and review all three credit reports.');items.push('Refresh live balances immediately before moving funds.');items.push('Check current soft-pull prequalification and targeted BT offers after lower balances report.');return items.map(x=>`<div class="metricline"><span>${esc(x)}</span></div>`).join('')}
function cardsUtilTable(cards){if(!cards?.length)return'<div class="empty">No cards in this mode.</div>';return`<div class="table-wrap"><table class="data-table"><thead><tr><th>Card</th><th class="right">Balance</th><th class="right">Limit</th><th>Utilization</th><th class="right">APR</th><th>Role</th></tr></thead><tbody>${cards.map(c=>{const u=num(c.limit)?num(c.balance)/num(c.limit):0;return`<tr><td>${esc(c.name)}</td><td class="right">${money(c.balance)}</td><td class="right">${money(c.limit)}</td><td><div class="util"><div class="bar ${utilClass(u)}"><span style="width:${Math.min(100,u*100)}%"></span></div><b>${pct(u,1)}</b></div></td><td class="right">${num(c.apr).toFixed(2)}%</td><td><span class="tag">${esc(c.role)}</span></td></tr>`}).join('')}</tbody></table></div>`}
function renderCards(){const s=state();document.getElementById('cardsPage').innerHTML=`<div class="grid"><div class="card span-12"><div class="section-title"><h2>Cards</h2><button class="btn primary" id="addCardBtn">Add Card</button></div><p class="muted small">Editable in ${appState.mode==='planning'?'Planning':'Live'} Mode. Core strategy recommendations are protected and do not change when cards are edited.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Card</th><th>Issuer</th><th>Balance</th><th>Limit</th><th>APR %</th><th>Statement</th><th>Due</th><th>Role</th><th>Reward role</th><th></th></tr></thead><tbody>${(s.cards||[]).map(cardRowEdit).join('')}</tbody></table></div></div></div>`;document.getElementById('addCardBtn').addEventListener('click',()=>{s.cards.push({id:uid('card'),name:'New Card',issuer:'',balance:0,limit:0,apr:0,minimumPayment:0,statementDate:'',dueDate:'',role:'Support',rewardRole:'',notes:'',lastPayment:0});saveState();renderCards()});document.querySelectorAll('[data-card-field]').forEach(el=>el.addEventListener('change',()=>{const c=s.cards.find(x=>x.id===el.dataset.cardId);if(!c)return;c[el.dataset.cardField]=['balance','limit','apr','minimumPayment'].includes(el.dataset.cardField)?num(el.value):el.value;saveState();renderCards()}));document.querySelectorAll('[data-remove-card]').forEach(b=>b.addEventListener('click',()=>{if(confirm('Remove this card from the editable portfolio? Core strategy data will remain protected.')){s.cards=s.cards.filter(c=>c.id!==b.dataset.removeCard);saveState();renderCards()}}))}
function cardRowEdit(c){const input=(f,type='text',w='')=>`<input style="min-width:${w||'95px'}" type="${type}" data-card-field="${f}" data-card-id="${c.id}" value="${esc(c[f]??'')}">`;return`<tr><td>${input('name','text','170px')}</td><td>${input('issuer','text','130px')}</td><td>${input('balance','number')}</td><td>${input('limit','number')}</td><td>${input('apr','number','75px')}</td><td>${input('statementDate','date','130px')}</td><td>${input('dueDate','date','130px')}</td><td><select data-card-field="role" data-card-id="${c.id}">${['Core','Support','Financing','Dormant'].map(x=>`<option ${c.role===x?'selected':''}>${x}</option>`).join('')}</select></td><td>${input('rewardRole','text','180px')}</td><td><button class="btn danger small" data-remove-card="${c.id}">Remove</button></td></tr>`}
function renderPlans(){const s=state(),sc=coreScenario(appState.activePlan.funding,appState.activePlan.strategy);if(!sc){document.getElementById('plansPage').innerHTML='<div class="card"><div class="empty">No core scenario available.</div></div>';return}document.getElementById('plansPage').innerHTML=`<div class="grid"><div class="card span-12"><div class="plan-header"><div><div class="plan-title">${money(sc.funding)} - ${esc(sc.strategy)}</div><div class="muted small">${esc(CORE.strategyNotes[sc.strategy]||'')}</div></div><select id="planSelect">${planOptions()}</select></div><div class="score-grid" style="margin-top:12px">${scoreBox('Financial',sc.scores.financial)}${scoreBox('Credit',sc.scores.credit)}${scoreBox('BT / Refi',sc.scores.bt_refi)}${scoreBox('Wallet / Ops',sc.scores.wallet_ops)}${scoreBox('Overall',sc.scores.overall)}</div></div><div class="card span-12"><div class="section-title"><h2>Original Allocation vs. Actual / Current</h2></div>${planTable(sc,s)}</div><div class="card span-6"><div class="section-title"><h2>Before / After Metrics</h2></div>${metricLines(sc)}</div><div class="card span-6"><div class="section-title"><h2>Strategy Read-up</h2></div>${strategyReadup(sc)}</div></div>`;document.getElementById('planSelect').addEventListener('change',e=>{const [f,...r]=e.target.value.split('|');appState.activePlan={funding:Number(f),strategy:r.join('|')};saveState();renderPlans()})}
function scoreBox(label,v){return`<div class="score"><b>${num(v).toFixed(1)}</b><small>${label}</small></div>`}
function planTable(sc,s){return`<div class="table-wrap"><table class="data-table"><thead><tr><th>Card</th><th class="right">Original payment</th><th class="right">Modeled ending</th><th class="right">Actual paid logged</th><th class="right">Current balance</th><th>Current util.</th><th>Modeled util.</th></tr></thead><tbody>${sc.rows.map(r=>{const c=cardByName(s,r.name);const current=c?num(c.balance):0,u=c&&num(c.limit)?num(c.balance)/num(c.limit):0;return`<tr><td>${esc(r.name)}</td><td class="right">${money(r.payment)}</td><td class="right">${money(r.ending_balance)}</td><td class="right">${money(actualPaidByCard(s,r.name))}</td><td class="right">${c?money(current):'<span class="muted">Not in portfolio</span>'}</td><td>${c?pct(u,1):'-'}</td><td>${pct(r.ending_utilization,1)}</td></tr>`}).join('')}</tbody></table></div>`}
function metricLines(sc){const m=sc.metrics;return[['Starting debt',m.total_start],['Ending debt',m.total_end],['Ending aggregate utilization',m.aggregate_utilization_end,'pct'],['Annual interest reduction',m.annual_interest_reduction],['Remaining weighted APR',m.weighted_apr_remaining,'pct'],['Cards at $0',m.zero_balance_cards,'int'],['Cards >=90%',m.cards_ge_90,'int'],['Cards <30%',m.cards_lt_30,'int']].map(x=>`<div class="metricline"><span>${x[0]}</span><strong>${x[2]==='pct'?pct(x[1],1):x[2]==='int'?x[1]:money(x[1])}</strong></div>`).join('')}
function strategyReadup(sc){const rank=(CORE.rankings[String(sc.funding)]||[]).find(x=>x.strategy===sc.strategy)?.rank||'-';return`<p><strong>Rank:</strong> ${rank} of 5 at this funding level.</p><p>${esc(CORE.strategyNotes[sc.strategy]||'')}</p><p><strong>Execution:</strong> reconcile balances, dates, bureau data, inquiries, and live offers before using the dollar table.</p><p><strong>Application horizon:</strong> allow lower balances to report, then use prequalification before taking hard inquiries. Cash-back/general-spend card is the working first target; Amex follows after further stabilization.</p><p><strong>Refinancing:</strong> evaluate only against the residual debt after this allocation and only with a real quoted offer.</p>`}
function renderComparison(){const mixes=CORE.walletMixes;const roles=['Rotating bonus','Grocery','Dining','Gas / EV','Online shopping','General spending','Retail','Travel','Financing'];const names=Object.keys(mixes);document.getElementById('comparisonPage').innerHTML=`<div class="grid"><div class="card span-12"><div class="section-title"><h2>Comparison Chart</h2><span class="muted small">Future-state wallet reference; debt reduction comes first.</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Role</th>${names.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${roles.map(role=>`<tr><td><strong>${role}</strong></td>${names.map(n=>`<td>${esc(mixes[n][role]||'-')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></div>`}
function renderProgress(){const s=state();document.getElementById('progressPage').innerHTML=`<div class="grid"><div class="card span-12"><div class="section-title"><h2>Add Progress Event</h2></div><form id="eventForm" class="form-grid"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Type</label><select name="type"><option>Payment</option><option>Statement Report</option><option>FICO</option><option>Limit Change</option><option>BT Offer</option><option>Application</option><option>Note</option></select></div><div class="field"><label>Card</label><select name="cardName"><option value="">-</option>${(s.cards||[]).map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Amount / Score</label><input name="amount" type="number" step="0.01"></div><div class="field wide"><label>Notes</label><input name="notes" type="text"></div><div class="field"><label>&nbsp;</label><button class="btn primary" type="submit">Add Event</button></div></form></div><div class="card span-12"><div class="section-title"><h2>Progress Ledger</h2></div>${eventsTable(s.events||[])}</div></div>`;document.getElementById('eventForm').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);const ev={id:uid('event'),date:fd.get('date')||today(),type:fd.get('type'),cardName:fd.get('cardName')||'',amount:num(fd.get('amount'),0),notes:fd.get('notes')||''};s.events.push(ev);if(ev.type==='Payment'&&ev.cardName&&ev.amount>0){const c=cardByName(s,ev.cardName);if(c){c.balance=Math.max(0,num(c.balance)-ev.amount);c.lastPayment=ev.amount}}if(ev.type==='FICO'&&ev.amount>0)s.ficoReadings.push({id:uid('fico'),date:ev.date,score:Math.round(ev.amount),source:ev.notes||'Progress ledger'});if(ev.type==='Limit Change'&&ev.cardName&&ev.amount>0){const c=cardByName(s,ev.cardName);if(c)c.limit=ev.amount}saveState();renderProgress()})}
function eventsTable(events){if(!events.length)return'<div class="empty">No events recorded yet.</div>';const arr=[...events].sort((a,b)=>String(b.date).localeCompare(String(a.date)));return`<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Type</th><th>Card</th><th class="right">Amount / Score</th><th>Notes</th></tr></thead><tbody>${arr.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.type)}</td><td>${esc(e.cardName||'-')}</td><td class="right">${e.type==='FICO'?Math.round(num(e.amount)):money(e.amount)}</td><td>${esc(e.notes)}</td></tr>`).join('')}</tbody></table></div>`}
function renderCredit(){const s=state(),p=portfolio(s),r=readiness(s);document.getElementById('creditPage').innerHTML=`<div class="grid">${kpi('Tracked FICO',currentFico(s)||'Pending','Latest recorded reading')}${kpi('Aggregate utilization',pct(p.util,1),'Portfolio-wide')}${kpi('Cards >=50%',p.high50,'Individual utilization')}${kpi('Available credit',money(p.available),'Based on editable limits')}<div class="card span-6"><div class="section-title"><h2>Application Readiness</h2></div><div class="readiness"><span class="dot ${r.cls}"></span><strong>${r.label}</strong></div><p>${r.reason}</p><div class="callout warn small">This is a planning indicator, not a lender approval probability or FICO prediction.</div></div><div class="card span-6"><div class="section-title"><h2>Underwriting Context</h2></div><div class="form-grid"><div class="field wide"><label>Recent hard inquiries</label><input id="inq" value="${esc(s.settings?.recentInquiries||'')}"></div><div class="field wide"><label>Recent new accounts</label><input id="newAccts" value="${esc(s.settings?.newAccounts||'')}"></div><div class="field wide"><label>FICO model / bureau</label><input id="ficoModel" value="${esc(s.settings?.ficoModel||'')}"></div><div class="field wide"><label>Bureau notes</label><input id="bureauNotes" value="${esc(s.settings?.bureauNotes||'')}"></div></div></div><div class="card span-12"><div class="section-title"><h2>FICO History</h2></div>${ficoTable(s.ficoReadings||[])}</div></div>`;['inq','newAccts','ficoModel','bureauNotes'].forEach(id=>document.getElementById(id).addEventListener('change',e=>{const map={inq:'recentInquiries',newAccts:'newAccounts',ficoModel:'ficoModel',bureauNotes:'bureauNotes'};s.settings[map[id]]=e.target.value;saveState()}))}
function ficoTable(arr){if(!arr.length)return'<div class="empty">No FICO readings recorded.</div>';return`<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Score</th><th>Source</th></tr></thead><tbody>${arr.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td><strong>${x.score}</strong></td><td>${esc(x.source||'')}</td></tr>`).join('')}</tbody></table></div>`}
function renderOffers(){const s=state();document.getElementById('offersPage').innerHTML=`<div class="grid"><div class="card span-12"><div class="section-title"><h2>Add Offer</h2></div><form id="offerForm" class="form-grid"><div class="field"><label>Issuer</label><input name="issuer"></div><div class="field"><label>Type</label><input name="type" value="0% Balance Transfer"></div><div class="field"><label>Promo APR %</label><input name="apr" type="number" step="0.01" value="0"></div><div class="field"><label>Months</label><input name="months" type="number"></div><div class="field"><label>Transfer fee %</label><input name="fee" type="number" step="0.01"></div><div class="field"><label>Available amount</label><input name="available" type="number" step="0.01"></div><div class="field"><label>Expiration</label><input name="expiration" type="date"></div><div class="field wide"><label>Eligible / notes</label><input name="notes"></div><div class="field"><label>&nbsp;</label><button class="btn primary" type="submit">Add Offer</button></div></form></div><div class="card span-12"><div class="section-title"><h2>Offer Analysis</h2></div>${offerTable(s.offers||[])}</div></div>`;document.getElementById('offerForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);s.offers.push({id:uid('offer'),issuer:f.get('issuer'),type:f.get('type'),apr:num(f.get('apr')),months:num(f.get('months')),fee:num(f.get('fee')),available:num(f.get('available')),expiration:f.get('expiration'),notes:f.get('notes')});saveState();renderOffers()})}
function offerTable(arr){if(!arr.length)return'<div class="empty">No current offers recorded. Targeted offers are not assumed.</div>';return`<div class="table-wrap"><table class="data-table"><thead><tr><th>Issuer</th><th>Offer</th><th>APR</th><th>Months</th><th>Fee</th><th class="right">Capacity</th><th>Expiration</th><th>Quick economics</th></tr></thead><tbody>${arr.map(o=>{const fee=num(o.available)*num(o.fee)/100;return`<tr><td>${esc(o.issuer)}</td><td>${esc(o.type)}</td><td>${num(o.apr).toFixed(2)}%</td><td>${o.months||'-'}</td><td>${num(o.fee).toFixed(2)}%</td><td class="right">${money(o.available)}</td><td>${esc(o.expiration||'-')}</td><td>Fee on full capacity: ${money(fee)}. Compare against interest avoided on the specific balance.</td></tr>`}).join('')}</tbody></table></div>`}
function renderApplications(){const s=state();document.getElementById('applicationsPage').innerHTML=`<div class="grid"><div class="card span-12"><div class="section-title"><h2>Add Application Target</h2></div><form id="appForm" class="form-grid"><div class="field wide"><label>Target card</label><input name="card"></div><div class="field"><label>Role</label><input name="role" value="Cash-back / general spend"></div><div class="field"><label>Target window</label><input name="window" value="3-6 months"></div><div class="field"><label>Status</label><select name="status"><option>Potential</option><option>Prequalification</option><option>Planned</option><option>Applied</option><option>Approved</option><option>Declined</option></select></div><div class="field wide"><label>Notes</label><input name="notes"></div><div class="field"><label>&nbsp;</label><button class="btn primary" type="submit">Add Target</button></div></form></div><div class="card span-12"><div class="section-title"><h2>Application Pipeline</h2></div>${applicationTable(s.applications||[])}</div></div>`;document.getElementById('appForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);s.applications.push({id:uid('app'),card:f.get('card'),role:f.get('role'),window:f.get('window'),status:f.get('status'),notes:f.get('notes')});saveState();renderApplications()})}
function applicationTable(arr){if(!arr.length)return'<div class="empty">No targets recorded. Working sequence: cash-back/general spend first, Amex after further stabilization.</div>';return`<div class="table-wrap"><table class="data-table"><thead><tr><th>Target</th><th>Role</th><th>Window</th><th>Status</th><th>Notes</th></tr></thead><tbody>${arr.map(a=>`<tr><td>${esc(a.card)}</td><td>${esc(a.role)}</td><td>${esc(a.window)}</td><td><span class="tag">${esc(a.status)}</span></td><td>${esc(a.notes)}</td></tr>`).join('')}</tbody></table></div>`}
function renderWallet(){const mix=appState.activeWalletMix,m=CORE.walletMixes[mix];document.getElementById('walletPage').innerHTML=`<div class="grid"><div class="card span-12"><div class="section-title"><h2>Active Wallet Mix</h2><select id="mixSelect">${Object.keys(CORE.walletMixes).map(n=>`<option ${n===mix?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Category</th><th>Primary card / rule</th></tr></thead><tbody>${Object.entries(m).map(([k,v])=>`<tr><td><strong>${esc(k)}</strong></td><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div></div><div class="card span-6"><div class="section-title"><h2>What should I use?</h2></div><div class="form-grid"><div class="field wide"><label>Purchase category</label><select id="lookupCat">${Object.keys(m).map(k=>`<option>${esc(k)}</option>`).join('')}</select></div></div><div class="lookup-result" id="lookupResult"></div></div><div class="card span-6"><div class="section-title"><h2>Operating Rule</h2></div><p>Do not spend on a revolving-balance card merely to earn rewards. Use the reward routing only after the relevant card's grace period is restored and the statement balance can be paid in full.</p><div class="callout small">Mix 5 has the highest theoretical earning potential; Mix 4 is the strongest real-world balance of simplicity, cash-back floor, and premium travel.</div></div></div>`;const result=()=>document.getElementById('lookupResult').textContent=m[document.getElementById('lookupCat').value]||'-';document.getElementById('lookupCat').addEventListener('change',result);result();document.getElementById('mixSelect').addEventListener('change',e=>{appState.activeWalletMix=e.target.value;saveState();renderWallet()})}
function dataQuality(s){const cards=s.cards||[];let total=1,filled=currentFico(s)>0?1:0;cards.forEach(c=>{['balance','limit','apr','statementDate','dueDate'].forEach(k=>{total++;if(c[k]!==''&&c[k]!=null)filled++})});total+=4;['recentInquiries','newAccounts','ficoModel','bureauNotes'].forEach(k=>{if(s.settings?.[k])filled++});return Math.round(filled/total*100)}
function renderSettings(){const s=state(),quality=dataQuality(s);document.getElementById('settingsPage').innerHTML=`<div class="grid"><div class="card span-6"><div class="section-title"><h2>Versions & Data Quality</h2></div><div class="metricline"><span>Interface version</span><strong>${CORE.interfaceVersion}</strong></div><div class="metricline"><span>Calculation engine</span><strong>${CORE.calculationEngineVersion}</strong></div><div class="metricline"><span>Strategy library</span><strong>${CORE.strategyLibraryVersion}</strong></div><div class="metricline"><span>Analysis date</span><strong>${CORE.analysisDate}</strong></div><div class="metricline"><span>Data completeness</span><strong>${quality}%</strong></div><div class="metricline"><span>Last saved</span><strong class="small">${esc(appState.savedAt||'-')}</strong></div><div class="callout ${quality<80?'warn':'good'} small" style="margin-top:10px">Missing execution fields are expected until statement dates, bureau details, and refreshed balances are entered.</div></div>
 <div class="card span-6"><div class="section-title"><h2>Export / Import</h2></div><div class="toolbar"><button class="btn primary" id="exportJson">Export Full Backup JSON</button><button class="btn" id="exportCards">Cards & Balances CSV</button><button class="btn" id="exportProgress">Progress History CSV</button><button class="btn" id="printSummary">Print Plan Summary</button><button class="btn" id="shareableHtml">Export Sanitized Shareable HTML</button></div><div style="margin-top:12px"><label class="btn" for="importJson">Import Full Backup JSON</label><input class="hidden" type="file" id="importJson" accept="application/json,.json"></div><p class="muted small">The JSON backup is the authoritative portable dashboard state. GitHub Pages does not synchronize local browser state between devices.</p></div>
 <div class="card span-6"><div class="section-title"><h2>Snapshots</h2><button class="btn" id="makeSnapshot">Create Snapshot</button></div><div id="snapshotList" class="snapshot-list">${snapshotsHtml(s.snapshots||[])}</div></div>
 <div class="card span-6"><div class="section-title"><h2>Planning Mode Controls</h2></div><div class="toolbar"><button class="btn" id="resetPlanning">Reset Planning to Live</button><button class="btn primary" id="applyPlanning">Apply Planning to Live</button></div><p class="muted small">Applying Planning to Live replaces the editable Live portfolio/state with the current Planning sandbox. Core recommendations remain protected.</p></div>
 <div class="card span-12"><div class="section-title"><h2>Reset Controls</h2></div><div class="toolbar"><button class="btn danger" id="resetProgress">Reset Progress</button><button class="btn danger" id="clearCards">Reset Card Portfolio</button><button class="btn" id="restoreCards">Restore Original Card Snapshot</button><button class="btn danger" id="clearOffersApps">Clear Application / Offer History</button><button class="btn" id="restorePlan">Restore Recommended Allocations</button><button class="btn danger" id="factoryReset">Factory Reset Personal Data</button></div><p class="muted small">Core Strategy Library and Wallet Reference Library are embedded in the application and survive all ordinary resets.</p></div>
 <div class="card span-12"><div class="section-title"><h2>Refinancing Benchmark</h2></div>${refiCalculator()}</div></div>`;wireSettings(s)}
function snapshotsHtml(arr){if(!arr.length)return'<div class="empty">No snapshots yet.</div>';return arr.slice().reverse().map(x=>`<div class="snapshot-row"><div><strong>${esc(x.name)}</strong><div class="muted small">${esc(x.createdAt)}</div></div><button class="btn small" data-restore-snap="${x.id}">Restore</button></div>`).join('')}
function refiCalculator(){const sc=coreScenario(appState.activePlan.funding,appState.activePlan.strategy);const debt=sc?sc.metrics.total_end:0;return`<div class="form-grid"><div class="field"><label>Post-plan debt</label><input id="refiDebt" type="number" value="${debt.toFixed(2)}"></div><div class="field"><label>Loan APR %</label><input id="refiApr" type="number" step="0.01"></div><div class="field"><label>Origination fee %</label><input id="refiFee" type="number" step="0.01"></div><div class="field"><label>Term months</label><input id="refiTerm" type="number"></div><div class="field full"><button class="btn" id="calcRefi">Calculate Benchmark</button><div id="refiOut" class="callout warn small" style="margin-top:10px">Enter a real quoted offer. No refinancing terms are assumed.</div></div></div>`}
function wireSettings(s){document.getElementById('exportJson').onclick=()=>download('Financial_Command_Center_Backup.json',JSON.stringify(appState,null,2),'application/json');document.getElementById('exportCards').onclick=()=>download('Cards_and_Balances.csv',toCsv((s.cards||[]).map(c=>({Card:c.name,Issuer:c.issuer,Balance:c.balance,Limit:c.limit,APR:c.apr,Statement:c.statementDate,Due:c.dueDate,Role:c.role}))),'text/csv');document.getElementById('exportProgress').onclick=()=>download('Progress_History.csv',toCsv((s.events||[]).map(e=>({Date:e.date,Type:e.type,Card:e.cardName,Amount:e.amount,Notes:e.notes}))),'text/csv');document.getElementById('printSummary').onclick=()=>window.print();document.getElementById('shareableHtml').onclick=exportSanitizedHtml;document.getElementById('importJson').addEventListener('change',importBackup);document.getElementById('makeSnapshot').onclick=()=>{const name=prompt('Snapshot name','Snapshot '+new Date().toLocaleDateString());if(name){s.snapshots=s.snapshots||[];s.snapshots.push({id:uid('snap'),name,createdAt:new Date().toISOString(),data:clone(s)});saveState();renderSettings()}};document.querySelectorAll('[data-restore-snap]').forEach(b=>b.onclick=()=>{const snap=(s.snapshots||[]).find(x=>x.id===b.dataset.restoreSnap);if(snap&&confirm('Restore this snapshot to the current mode?')){if(appState.mode==='planning')appState.planning=clone(snap.data);else appState.live=clone(snap.data);saveState();renderAll()}});document.getElementById('resetPlanning').onclick=()=>{if(confirm('Reset Planning Mode to the current Live state?')){appState.planning=clone(appState.live);saveState();renderAll()}};document.getElementById('applyPlanning').onclick=()=>{if(!appState.planning)return alert('No Planning state exists.');if(confirm('Apply the current Planning state to Live? This replaces editable Live state, not core strategy content.')){appState.live=clone(appState.planning);appState.mode='live';saveState();setMode('live')}};document.getElementById('resetProgress').onclick=()=>{if(confirm('Reset progress history, FICO tracking beyond baseline, offers/applications, and actual payment events? Export a backup first if needed.')){s.events=[];s.ficoReadings=clone(initialPersonal.ficoReadings);saveState();renderAll()}};document.getElementById('clearCards').onclick=()=>{if(confirm('Clear the editable card portfolio? Core strategy tables remain available.')){s.cards=[];saveState();renderAll()}};document.getElementById('restoreCards').onclick=()=>{if(confirm('Restore the original eight-card snapshot?')){s.cards=clone(initialPersonal.cards);saveState();renderAll()}};document.getElementById('clearOffersApps').onclick=()=>{if(confirm('Clear offers and application history?')){s.offers=[];s.applications=[];saveState();renderAll()}};document.getElementById('restorePlan').onclick=()=>{appState.activePlan={funding:45000,strategy:'Application + BT Positioning'};saveState();renderAll()};document.getElementById('factoryReset').onclick=()=>{if(confirm('Factory reset personal data to the original baseline? Core strategy and wallet libraries stay embedded.')){if(appState.mode==='planning')appState.planning=clone(initialPersonal);else appState.live=clone(initialPersonal);saveState();renderAll()}};document.getElementById('calcRefi').onclick=()=>{const P=num(document.getElementById('refiDebt').value),apr=num(document.getElementById('refiApr').value)/100,fee=num(document.getElementById('refiFee').value)/100,n=Math.round(num(document.getElementById('refiTerm').value));if(P<=0||apr<0||n<=0)return document.getElementById('refiOut').textContent='Enter valid debt, APR, and term.';const financed=P*(1+fee),r=apr/12,pmt=r===0?financed/n:financed*r/(1-Math.pow(1+r,-n)),total=pmt*n,cost=total-P;document.getElementById('refiOut').innerHTML=`Financed principal: <strong>${money(financed)}</strong> | Monthly payment: <strong>${money(pmt)}</strong> | Total scheduled payments: <strong>${money(total)}</strong> | Financing cost above original debt: <strong>${money(cost)}</strong>. Compare this with the residual card-interest path and prepayment rules.`}}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function toCsv(rows){if(!rows.length)return'';const keys=Object.keys(rows[0]);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return [keys.map(q).join(','),...rows.map(r=>keys.map(k=>q(r[k])).join(','))].join('\n')}
function importBackup(e){const file=e.target.files?.[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const obj=JSON.parse(rd.result);if(obj.schemaVersion!==1)throw new Error('Unsupported schema version');if(!obj.live||!Array.isArray(obj.live.cards))throw new Error('Invalid backup structure');if(confirm('Import this backup and replace current dashboard state?')){appState=obj;saveState();setMode(appState.mode==='planning'?'planning':'live');renderAll()}}catch(err){alert('Import failed: '+err.message)}};rd.readAsText(file)}
function exportSanitizedHtml(){const sanitizedCore={analysisDate:CORE.analysisDate,strategyLibraryVersion:CORE.strategyLibraryVersion,calculationEngineVersion:CORE.calculationEngineVersion,interfaceVersion:CORE.interfaceVersion,weights:CORE.weights,scenarios:[],rankings:{},sensitivity:[],sources:CORE.sources,walletMixes:CORE.walletMixes,strategyNotes:CORE.strategyNotes};const sanitizedBoot=clone(BOOT);sanitizedBoot.activePlan={funding:0,strategy:''};sanitizedBoot.live.cards=[];sanitizedBoot.live.ficoReadings=[];sanitizedBoot.live.events=[];sanitizedBoot.live.offers=[];sanitizedBoot.live.applications=[];sanitizedBoot.live.settings={recentInquiries:'',newAccounts:'',ficoModel:'',bureauNotes:'',lastReconciled:''};sanitizedBoot.live.snapshots=[];sanitizedBoot.planning=null;const cloneDoc=document.documentElement.cloneNode(true);const ids={Dashboard:'dashboard',Cards:'cardsPage',Plans:'plansPage',Comparison:'comparisonPage',Progress:'progressPage',Credit:'creditPage',Offers:'offersPage',Applications:'applicationsPage',Wallet:'walletPage',Settings:'settingsPage'};cloneDoc.querySelectorAll('.page').forEach(el=>{const id=ids[el.dataset.page];el.innerHTML=id?`<div id="${id}"></div>`:''});const status=cloneDoc.querySelector('#saveStatus');if(status)status.textContent='Share-safe copy';const note=cloneDoc.querySelector('#navNote');if(note)note.textContent='Share-safe shell: personal portfolio and modeled allocation figures removed.';let src='<!DOCTYPE html>'+cloneDoc.outerHTML;src=src.replace(/<script id="core-data" type="application\/json">[\s\S]*?<\/script>/,`<script id="core-data" type="application/json">${JSON.stringify(sanitizedCore).replace(/<\//g,'<\/')}<\/script>`).replace(/<script id="bootstrap-data" type="application\/json">[\s\S]*?<\/script>/,`<script id="bootstrap-data" type="application/json">${JSON.stringify(sanitizedBoot).replace(/<\//g,'<\/')}<\/script>`);download('Financial_Command_Center_Shareable.html',src,'text/html')}
function renderAll(){renderDashboard();renderCards();renderPlans();renderComparison();renderProgress();renderCredit();renderOffers();renderApplications();renderWallet();renderSettings();document.getElementById('modeLabel').textContent=appState.mode==='planning'?'Planning':'Live';document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===appState.mode));renderNav()}
function renderPage(p){const f={Dashboard:renderDashboard,Cards:renderCards,Plans:renderPlans,Comparison:renderComparison,Progress:renderProgress,Credit:renderCredit,Offers:renderOffers,Applications:renderApplications,Wallet:renderWallet,Settings:renderSettings}[p];if(f)f()}
document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));renderAll();
})();
</script></body></html>
